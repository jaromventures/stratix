name: Stratix tvOS Device IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stratix-device-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-device-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out Stratix
        uses: actions/checkout@v4

      - name: Select Xcode 26+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          SDKROOT="$(xcrun --sdk appletvos --show-sdk-path)"
          xcrun --sdk appletvos --show-sdk-version
          test -d "$SDKROOT"
          major="$(xcodebuild -version | awk '/Xcode / {split($2,a,"."); print a[1]}')"
          test "$major" -ge 26

      - name: Build unsigned physical-device IPA
        run: bash Tools/ci/build_unsigned_device_ipa.sh

      - name: Upload IPA and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stratix-tvos-device-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stratix-device-build/Stratix-tvOS-unsigned.ipa
            ${{ runner.temp }}/stratix-device-build/DerivedData/Logs/**
            ${{ runner.temp }}/stratix-device-build/**/*.log
